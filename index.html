<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #202124;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            padding: 0 24px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 240px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 20px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #202124;
            color: white;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .menu-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #f1f3f4;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .welcome {
            max-width: 700px;
            margin: 80px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 17px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        .input-box {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        .send {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: #202124;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .messages {
                padding: 20px;
            }

            .welcome h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    ✦ My AI Assistant
</header>

<div class="container">

    <aside class="sidebar">
        <button class="new-chat">+ New Chat</button>

        <div class="menu-item">💬 Chats</div>
        <div class="menu-item">📚 Study</div>
        <div class="menu-item">🔎 Research</div>
        <div class="menu-item">📝 Writing</div>
        <div class="menu-item">🧠 Memory</div>
        <div class="menu-item">⚙️ Settings</div>
    </aside>

    <main class="chat-area">

        <div class="messages">
            <div class="welcome">
                <h1>How can I help?</h1>
                <p>Your personal AI assistant.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <input
                    type="text"
                    placeholder="Ask me anything..."
                >

                <button class="send">
                    ➤
                </button>
            </div>
        </div>

    </main>

</div>

</body>
</html>
